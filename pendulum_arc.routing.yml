pendulum_arc.dashboard:
  path: /admin/pendulum-arc
  defaults:
    _controller: Drupal\pendulum_arc\Controller\PageController::dashboard
    _title: 'Arc Analytics - Dashboard'
  requirements:
    _permission: 'administer pendulum arc'
  options:
    _admin_route: TRUE

pendulum_arc.connect:
  path: /admin/pendulum-arc/connect
  defaults:
    _controller: Drupal\pendulum_arc\Controller\PageController::connect
    _title: 'Arc Analytics - Connect'
  requirements:
    _permission: 'administer pendulum arc'
  options:
    _admin_route: TRUE

pendulum_arc.connect_api_key:
  path: /admin/pendulum-arc/connect/api-key
  defaults:
    _controller: Drupal\pendulum_arc\Controller\JsonController::apiKey
  requirements:
    _permission: 'administer pendulum arc'
    _csrf_request_header_token: 'TRUE'
  methods: [POST]
  options:
    _admin_route: TRUE

pendulum_arc.connect_reconnect:
  path: /admin/pendulum-arc/connect/reconnect
