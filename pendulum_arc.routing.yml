  requirements:
    _permission: 'administer pendulum arc'
    _csrf_request_header_token: 'TRUE'
  methods: [POST]
  options:
    _admin_route: TRUE

pendulum_arc.connect_pair:
  path: /admin/pendulum-arc/connect/pair
