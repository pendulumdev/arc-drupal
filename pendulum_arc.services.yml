services:
  pendulum_arc.config:
    class: Drupal\pendulum_arc\ArcConfig
    factory: ['Drupal\pendulum_arc\ArcConfig', 'fromSettings']
  pendulum_arc.client:
    class: Drupal\pendulum_arc\ArcClient
    factory: ['Drupal\pendulum_arc\ArcClientFactory', 'create']
    arguments: ['@http_client', '@pendulum_arc.config', '@request_stack']
  pendulum_arc.store:
    class: Drupal\pendulum_arc\ConnectionStore
    factory: ['Drupal\pendulum_arc\ConnectionStoreFactory', 'create']
    arguments: ['@state', '@keyvalue.expirable']
  pendulum_arc.links:
    class: Drupal\pendulum_arc\DrupalContentLinks
    arguments: ['@path.validator', '@entity_type.manager', '@current_user', '@config.factory', '@request_stack']
  pendulum_arc.profile:
    class: Drupal\pendulum_arc\DrupalSiteProfile
    arguments: ['@config.factory', '@request_stack']
  pendulum_arc.lock:
    class: Drupal\pendulum_arc\DrupalRefreshLock
    arguments: ['@lock']
  pendulum_arc.sleeper:
    class: Drupal\pendulum_arc\DrupalSleeper
  pendulum_arc.ids:
    class: Drupal\pendulum_arc\DrupalIdGenerator
    arguments: ['@uuid']
  pendulum_arc.connect:
    class: Drupal\pendulum_arc\ConnectService
    arguments:
      - '@pendulum_arc.store'
      - '@pendulum_arc.client'
      - '@pendulum_arc.config'
      - '@pendulum_arc.profile'
      - '@pendulum_arc.lock'
      - '@pendulum_arc.sleeper'
      - '@pendulum_arc.ids'
      - '@pendulum_arc.links'
      - '@pendulum_arc.google'
  pendulum_arc.google:
    class: Drupal\pendulum_arc\GoogleConnection
    arguments: ['@state']
  pendulum_arc.google_handoff:
    class: Drupal\pendulum_arc\GoogleHandoff
    arguments:
      - '@pendulum_arc.store'
      - '@pendulum_arc.connect'
      - '@pendulum_arc.client'
      - '@pendulum_arc.ids'
  pendulum_arc.invites:
    class: Drupal\pendulum_arc\InviteService
    arguments:
      - '@pendulum_arc.store'
      - '@pendulum_arc.connect'
      - '@pendulum_arc.client'
      - '@entity_type.manager'
      - '@pendulum_arc.ids'
  pendulum_arc.keyphrase_list:
    class: Drupal\pendulum_arc\KeyphraseList
    arguments: ['@database', '@state']
  pendulum_arc.keyphrase_read:
    class: Drupal\pendulum_arc\KeyphraseRead
    arguments: ['@entity_field.manager']
  pendulum_arc.keyphrase_scan:
    class: Drupal\pendulum_arc\KeyphraseScan
    arguments:
      - '@pendulum_arc.keyphrase_list'
      - '@pendulum_arc.keyphrase_read'
      - '@entity_type.manager'
  pendulum_arc.keyphrases:
    class: Drupal\pendulum_arc\KeyphraseSync
    arguments:
      - '@pendulum_arc.store'
      - '@pendulum_arc.connect'
      - '@pendulum_arc.client'
      - '@pendulum_arc.keyphrase_list'
      - '@pendulum_arc.keyphrase_scan'
      - '@pendulum_arc.keyphrase_read'
      - '@pendulum_arc.ids'
      - '@config.factory'
      - '@lock'
      - '@pendulum_arc.profile'
  pendulum_arc.alerts:
    class: Drupal\pendulum_arc\Alerts
    arguments:
      - '@pendulum_arc.store'
      - '@pendulum_arc.google'
      - '@pendulum_arc.keyphrase_list'
  pendulum_arc.consent_store:
    class: Drupal\pendulum_arc\ConsentStore
    arguments:
      - '@state'
      - '@module_handler'
      - '@cache.asset_chain'
      - '@cache_tags.invalidator'
      - '@?cache.page'
      - '@?cache.dynamic_page_cache'
  pendulum_arc.consent_log:
    class: Drupal\pendulum_arc\ConsentLog
    arguments: ['@database', '@flood']
  pendulum_arc.consent_markup:
    class: Drupal\pendulum_arc\ConsentMarkup
  pendulum_arc.consent_front:
    class: Drupal\pendulum_arc\ConsentFront
    arguments:
      - '@pendulum_arc.consent_store'
      - '@pendulum_arc.consent_markup'
      - '@request_stack'
      - '@router.admin_context'
      - '@library.discovery'
      - '@theme.manager'
      - '@file_url_generator'
      - '@module_handler'
